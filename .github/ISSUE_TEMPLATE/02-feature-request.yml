name: Feature request
description: Suggest a new feature or a change to an existing one.
title: "[Feature] "
labels: ["type: feature", "status: needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please search existing requests before posting. Feature requests are public; don't include sensitive information.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS
        - Desktop
        - All platforms
        - Not platform-specific
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Tell us about the situation or limitation, not just the proposed solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Secure to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or additional context (optional)
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched for an existing request.
          required: true
